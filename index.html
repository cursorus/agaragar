<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Agar.io Smooth Edition</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
        canvas { display: block; }
        #login { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; flex-direction: column; z-index: 100; }
        input, button { padding: 15px; font-size: 20px; margin: 10px; border-radius: 5px; border: none; }
        button { background: #27ae60; color: white; cursor: pointer; }
    </style>
</head>
<body>

<div id="login">
    <h1 style="color:white">Agar.io (Smooth)</h1>
    <input id="nickname" placeholder="Твой ник" value="Игрок">
    <button onclick="startGame()">Играть</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const SERVER_URL = "https://agaragar--5xf9jnjrvk.replit.app"; 

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let socket;
    let serverState = { players: {}, food: [], bots: [] };
    let lerpState = { players: {}, bots: [] }; // Для плавного движения
    let mySocketId = null;
    let camera = { x: 0, y: 0 };

    function startGame() {
        document.getElementById('login').style.display = 'none';
        socket = io(SERVER_URL);

        socket.on('connect', () => {
            mySocketId = socket.id;
            socket.emit('join', document.getElementById('nickname').value);
        });

        socket.on('state', (state) => {
            serverState = state;
        });

        requestAnimationFrame(renderLoop);
    }

    // Функция интерполяции (плавного перехода)
    function lerp(start, end, amt) {
        return (1 - amt) * start + amt * end;
    }

    function renderLoop() {
        // 1. Обновляем "плавные" координаты
        updateLerp();
        
        // 2. Рисуем
        draw();

        requestAnimationFrame(renderLoop);
    }

    function updateLerp() {
        const smoothing = 0.15; // Чем меньше, тем плавнее, но больше задержка

        // Плавно двигаем игроков
        for (let id in serverState.players) {
            if (!lerpState.players[id]) {
                lerpState.players[id] = { ...serverState.players[id] };
            }
            let sP = serverState.players[id];
            let lP = lerpState.players[id];
            lP.x = lerp(lP.x, sP.x, smoothing);
            lP.y = lerp(lP.y, sP.y, smoothing);
            lP.r = lerp(lP.r, sP.r, smoothing);
            lP.name = sP.name;
            lP.color = sP.color;
        }

        // Плавно двигаем ботов
        serverState.bots.forEach((sB, i) => {
            if (!lerpState.bots[i]) {
                lerpState.bots[i] = { ...sB };
            }
            let lB = lerpState.bots[i];
            lB.x = lerp(lB.x, sB.x, smoothing);
            lB.y = lerp(lB.y, sB.y, smoothing);
            lB.r = lerp(lB.r, sB.r, smoothing);
            lB.name = sB.name;
            lB.color = sB.color;
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let me = lerpState.players[mySocketId];
        if (me) {
            camera.x = me.x - canvas.width / 2;
            camera.y = me.y - canvas.height / 2;
        }

        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        // Еда (она статична, её не надо интерполировать)
        serverState.food.forEach(f => {
            ctx.beginPath(); ctx.arc(f.x, f.y, 5, 0, Math.PI*2);
            ctx.fillStyle = f.color; ctx.fill();
        });

        // Рисуем всех из lerpState
        [...Object.values(lerpState.players), ...lerpState.bots].forEach(p => {
            if (p.x < 0 || p.x > 3000) return; 
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.fillText(p.name, p.x, p.y);
        });

        ctx.restore();
    }

    canvas.addEventListener('mousemove', (e) => {
        if (!socket) return;
        socket.emit('input', { 
            x: e.clientX - canvas.width / 2, 
            y: e.clientY - canvas.height / 2 
        });
    });
</script>
</body>
</html>
